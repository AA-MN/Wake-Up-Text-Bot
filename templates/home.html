{% extends "layout.html" %}

{% block content %}
    {% for post in posts%}
        <h1>{{ post.title }}</h1>
        <p>{{ post.author }} on {{ post.date_posted }}</p>
        <p>{{ post.content }}</p>
    {% endfor %}

    <form method="post">

    <p>
        <label for="waketime">Wake Up Time:</label>
        <input type="time" id = "waketime" name="waketime">
    </p>
    <p>
        <label for="reason">Wake Up Reason:</label>
        <input type="text" id = "reason" name="reason">
    </p>
    <p>
        <label for="quote">Quote Choice:</label>
        <input type="text" id = "quote" name="quote">
    </p>
    <p>
        <label for="ntfy_topic">Ntfy Topic:</label>
        <input type="text" id = "ntfy_topic" name="ntfy_topic">
    </p>

    <p class = button>
        <button type="submit">Submit Form</button>
    </p>

    </form>


{% endblock content %}
